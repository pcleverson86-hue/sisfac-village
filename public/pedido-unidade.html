<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pedido Mensal de Insumos - SISFAC 2.0</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Estilos mobile touch amigáveis */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-28">

  <!-- Cabeçalho Principal -->
  <header class="bg-gradient-to-r from-slate-900 via-teal-950 to-slate-900 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-teal-500/20 border border-teal-400/30 flex items-center justify-center text-teal-300 font-black text-lg">
          <i class="fa-solid fa-boxes-stacked"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm sm:text-base leading-tight">SISFAC 2.0</h1>
          <p class="text-[11px] text-teal-300 font-medium">Portal de Suprimentos & Materiais</p>
        </div>
      </div>
      <div id="badgeMesAno" class="text-xs bg-teal-900/80 border border-teal-500/40 text-teal-200 px-2.5 py-1 rounded-full font-mono font-semibold">
        Carregando...
      </div>
    </div>
  </header>

  <!-- Container de Conteúdo -->
  <main class="max-w-3xl mx-auto px-3 sm:px-4 py-4 space-y-4">

    <!-- Loading State -->
    <div id="loadingBox" class="bg-white rounded-2xl p-8 text-center shadow-sm border border-slate-200 space-y-3">
      <i class="fa-solid fa-spinner fa-spin text-3xl text-teal-600"></i>
      <p class="text-sm font-medium text-slate-600">Carregando catálogo de insumos e dados do prédio...</p>
    </div>

    <!-- Error State -->
    <div id="errorBox" class="hidden bg-rose-50 border border-rose-200 rounded-2xl p-6 text-center space-y-3">
      <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h2 class="font-bold text-rose-900 text-base">Não foi possível carregar o formulário</h2>
      <p id="errorMsg" class="text-xs text-rose-700 leading-relaxed"></p>
      <button onclick="location.reload()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow">Tentar Novamente</button>
    </div>

    <!-- Conteúdo do Formulário -->
    <div id="formContent" class="hidden space-y-4">

      <!-- Card do Cliente e Prédio -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 space-y-3">
        <div class="flex items-start justify-between">
          <div>
            <span class="text-[10px] font-bold uppercase tracking-wider text-teal-700 bg-teal-50 px-2 py-0.5 rounded-md border border-teal-200">
              Cliente / Contrato
            </span>
            <h2 id="clienteNome" class="text-base sm:text-lg font-black text-slate-900 mt-1"></h2>
          </div>
          <div id="statusPreenchimentoBadge" class="hidden text-xs font-semibold px-2.5 py-1 rounded-lg"></div>
        </div>

        <!-- Seletor ou Exibição do Prédio -->
        <div class="pt-2 border-t border-slate-100">
          <label class="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1.5">
            <i class="fa-solid fa-building text-teal-600"></i> Prédio / Bloco de Entrega:
          </label>
          <div id="seletorPredioContainer">
            <!-- Dropdown ou texto fixo via JS -->
          </div>
        </div>

        <!-- Dados do Responsável -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">
              <i class="fa-solid fa-user text-slate-400 mr-1"></i> Nome do Responsável / Solicitante:
            </label>
            <input type="text" id="respNome" placeholder="Ex: Síndico Carlos / Zelador João" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-teal-500 focus:bg-white transition outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">
              <i class="fa-brands fa-whatsapp text-emerald-500 mr-1"></i> Telefone / WhatsApp de Contato:
            </label>
            <input type="tel" id="respTel" placeholder="(00) 00000-0000" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-teal-500 focus:bg-white transition outline-none">
          </div>
        </div>
      </div>

      <!-- Barra de Filtros e Busca -->
      <div class="bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-slate-200/80 space-y-3">
        <!-- Campo de Busca -->
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
          <input type="text" id="buscaProduto" oninput="filtrarProdutos()" placeholder="🔍 Buscar insumo (ex: saco de lixo, cloro, papel toalha...)" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-teal-500 focus:bg-white transition outline-none">
        </div>

        <!-- Chips de Categorias -->
        <div id="categoriasChips" class="flex gap-1.5 overflow-x-auto pb-1 text-xs scrollbar-none">
          <!-- Gerado via JS -->
        </div>
      </div>

      <!-- Lista de Produtos -->
      <div id="produtosLista" class="space-y-2.5">
        <!-- Itens gerados via JS -->
      </div>

      <!-- Observações Finais -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-2">
        <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-comment-dots text-teal-600"></i> Observações ou Instruções para Entrega (opcional):
        </label>
        <textarea id="pedidoObservacoes" rows="2" placeholder="Ex: Entregar preferencialmente na portaria 2 entre 09h e 12h..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-xs focus:ring-2 focus:ring-teal-500 focus:bg-white transition outline-none"></textarea>
      </div>

    </div>

    <!-- Recibo / Comprovante de Sucesso -->
    <div id="reciboSucesso" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-emerald-200 text-center space-y-4">
      <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-2xl animate-bounce">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <div>
        <h2 class="text-xl font-black text-slate-900">Pedido Enviado com Sucesso!</h2>
        <p id="reciboSubtitulo" class="text-xs text-slate-600 mt-1"></p>
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-left font-mono text-xs space-y-1.5" id="reciboDetalhes">
        <!-- Gerado via JS -->
      </div>

      <div class="flex flex-col sm:flex-row gap-2 pt-2">
        <button onclick="reabrirParaEdicao()" class="flex-1 py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-pen-to-square"></i> Ajustar Quantidades
        </button>
        <button onclick="compartilharComprovanteWhatsApp()" class="flex-1 py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center justify-center gap-1.5">
          <i class="fa-brands fa-whatsapp"></i> Compartilhar Comprovante
        </button>
      </div>
    </div>

  </main>

  <!-- Barra Flutuante Fixa Inferior -->
  <div id="stickyBar" class="hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-slate-200 shadow-2xl p-3 z-50">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
      <div>
        <div class="text-[11px] text-slate-500 font-medium">Total Solicitado</div>
        <div class="flex items-baseline gap-1.5">
          <span id="totalItensQtd" class="text-lg sm:text-xl font-black text-teal-800 font-mono">0</span>
          <span class="text-xs font-semibold text-slate-600">unidades</span>
        </div>
      </div>

      <button id="btnEnviarPedido" onclick="enviarPedido()" class="bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 active:scale-95 text-white font-bold px-5 sm:px-7 py-3 rounded-xl shadow-md text-xs sm:text-sm flex items-center gap-2 transition duration-150 cursor-pointer">
        <span>Confirmar Pedido do Prédio</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <script>
    // Estado local da página pública
    const state = {
      token: '',
      clienteId: null,
      anoMes: '',
      unidadeId: null,
      tipoAcesso: 'geral',
      cliente: null,
      pedidoId: null,
      unidadeFixa: null,
      statusUnidade: null,
      unidades: [],
      produtos: [],
      quantidades: new Map(), // produtoId -> qtd
      categoriaAtiva: 'Todos',
      termoBusca: '',
      ultimoEnvio: null
    };

    function parseQueryParams() {
      const p = new URLSearchParams(window.location.search);
      state.token = p.get('token') || '';
      state.clienteId = p.get('cliente_id') ? parseInt(p.get('cliente_id'), 10) : null;
      state.anoMes = p.get('ano_mes') || '';
      state.unidadeId = p.get('unidade_id') ? parseInt(p.get('unidade_id'), 10) : null;
    }

    async function init() {
      parseQueryParams();

      const urlParams = new URLSearchParams();
      if (state.token) urlParams.set('token', state.token);
      if (state.clienteId) urlParams.set('cliente_id', state.clienteId);
      if (state.anoMes) urlParams.set('ano_mes', state.anoMes);
      if (state.unidadeId) urlParams.set('unidade_id', state.unidadeId);

      try {
        const res = await fetch('/api/publico/pedido-unidade?' + urlParams.toString());
        const data = await res.json();

        if (data.error) {
          throw new Error(data.message || 'Falha ao carregar dados do formulário.');
        }

        state.cliente = data.cliente;
        state.anoMes = data.ano_mes;
        state.pedidoId = data.pedido_id;
        state.tipoAcesso = data.tipo_acesso;
        state.unidadeFixa = data.unidade_fixa;
        state.statusUnidade = data.status_unidade;
        state.unidades = data.unidades || [];
        state.produtos = data.produtos || [];

        // Preencher itens já salvos
        if (Array.isArray(data.itens_salvos)) {
          data.itens_salvos.forEach(i => {
            state.quantidades.set(i.produto_id, i.quantidade);
          });
        }

        renderizarCabecalho();
        renderizarSeletorPredio();
        renderizarCategorias();
        renderizarProdutos();
        atualizarTotais();

        document.getElementById('loadingBox').classList.add('hidden');
        document.getElementById('formContent').classList.remove('hidden');
        document.getElementById('stickyBar').classList.remove('hidden');

      } catch (err) {
        document.getElementById('loadingBox').classList.add('hidden');
        document.getElementById('errorMsg').textContent = err.message;
        document.getElementById('errorBox').classList.remove('hidden');
      }
    }

    function formatarMesAno(anoMesStr) {
      if (!anoMesStr) return '';
      const [ano, mes] = anoMesStr.split('-');
      const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      const mesNome = meses[parseInt(mes, 10) - 1] || mes;
      return `${mesNome} / ${ano}`;
    }

    function renderizarCabecalho() {
      document.getElementById('badgeMesAno').innerHTML = `<i class="fa-regular fa-calendar mr-1"></i> ${formatarMesAno(state.anoMes)}`;
      document.getElementById('clienteNome').textContent = state.cliente?.nome_fantasia || state.cliente?.nome_razao_social || 'Cliente SISFAC';

      // Dados de responsável pré-preenchidos se houver
      if (state.statusUnidade) {
        if (state.statusUnidade.responsavel_nome) {
          document.getElementById('respNome').value = state.statusUnidade.responsavel_nome;
        }
        if (state.statusUnidade.responsavel_telefone) {
          document.getElementById('respTel').value = state.statusUnidade.responsavel_telefone;
        }
        if (state.statusUnidade.observacoes) {
          document.getElementById('pedidoObservacoes').value = state.statusUnidade.observacoes;
        }

        const badge = document.getElementById('statusPreenchimentoBadge');
        badge.classList.remove('hidden');
        if (state.statusUnidade.status === 'Enviado pelo Responsável') {
          badge.className = 'text-xs font-bold px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-200';
          badge.innerHTML = '<i class="fa-solid fa-check-double mr-1"></i> Pedido já enviado anteriormente';
        } else if (state.statusUnidade.status === 'Preenchido Manualmente') {
          badge.className = 'text-xs font-bold px-2.5 py-1 rounded-lg bg-sky-100 text-sky-800 border border-sky-200';
          badge.innerHTML = '<i class="fa-solid fa-pen mr-1"></i> Lançamento administrativo registrado';
        } else {
          badge.className = 'text-xs font-bold px-2.5 py-1 rounded-lg bg-amber-100 text-amber-800 border border-amber-200';
          badge.innerHTML = '<i class="fa-regular fa-clock mr-1"></i> Aguardando envio';
        }
      }
    }

    function renderizarSeletorPredio() {
      const container = document.getElementById('seletorPredioContainer');
      if (state.tipoAcesso === 'individual' && state.unidadeFixa) {
        state.unidadeId = state.unidadeFixa.id;
        container.innerHTML = `
          <div class="bg-teal-50/70 border border-teal-200 rounded-xl p-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-lg bg-teal-600 text-white flex items-center justify-center font-bold text-sm">
                <i class="fa-solid fa-building"></i>
              </div>
              <div>
                <span class="text-xs font-black text-teal-950 block">${state.unidadeFixa.nome_unidade}</span>
                <span class="text-[11px] text-teal-700">${state.unidadeFixa.endereco || 'Unidade Contratada'}</span>
              </div>
            </div>
            <span class="text-[10px] font-bold bg-teal-200/80 text-teal-800 px-2 py-0.5 rounded">Link Exclusivo</span>
          </div>
        `;
      } else {
        let options = state.unidades.map(u => `
          <option value="${u.id}" ${state.unidadeId === u.id ? 'selected' : ''}>
            ${u.nome_unidade} ${u.responsavel_local ? `(Resp: ${u.responsavel_local})` : ''}
          </option>
        `).join('');

        container.innerHTML = `
          <select id="selectPredio" onchange="aoMudarPredioDropdown(this.value)" class="w-full bg-slate-50 border-2 border-teal-500/40 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:border-teal-600 focus:bg-white outline-none transition cursor-pointer">
            <option value="">Selecione o Prédio que você representa...</option>
            ${options}
          </select>
        `;
        if (state.unidadeId) {
          aoMudarPredioDropdown(state.unidadeId);
        }
      }
    }

    async function aoMudarPredioDropdown(unidadeId) {
      state.unidadeId = parseInt(unidadeId, 10) || null;
      if (!state.unidadeId) return;

      const uni = state.unidades.find(u => u.id === state.unidadeId);
      if (uni && !document.getElementById('respNome').value) {
        if (uni.responsavel_local) document.getElementById('respNome').value = uni.responsavel_local;
        if (uni.telefone_local) document.getElementById('respTel').value = uni.telefone_local;
      }
    }

    function renderizarCategorias() {
      const container = document.getElementById('categoriasChips');
      const cats = ['Todos', ...new Set(state.produtos.map(p => p.categoria || 'Geral'))];

      container.innerHTML = cats.map(cat => {
        const ativo = state.categoriaAtiva === cat;
        return `
          <button type="button" onclick="selecionarCategoria('${cat}')" class="px-3 py-1.5 rounded-xl font-bold whitespace-nowrap text-[11px] transition cursor-pointer ${ativo ? 'bg-teal-700 text-white shadow-sm' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}">
            ${cat}
          </button>
        `;
      }).join('');
    }

    function selecionarCategoria(cat) {
      state.categoriaAtiva = cat;
      renderizarCategorias();
      renderizarProdutos();
    }

    function filtrarProdutos() {
      state.termoBusca = document.getElementById('buscaProduto').value.toLowerCase().trim();
      renderizarProdutos();
    }

    function renderizarProdutos() {
      const container = document.getElementById('produtosLista');
      let prods = state.produtos;

      if (state.categoriaAtiva !== 'Todos') {
        prods = prods.filter(p => p.categoria === state.categoriaAtiva);
      }

      if (state.termoBusca) {
        prods = prods.filter(p => 
          (p.descricao || '').toLowerCase().includes(state.termoBusca) ||
          (p.categoria || '').toLowerCase().includes(state.termoBusca) ||
          (p.codigo_referencia || '').toLowerCase().includes(state.termoBusca)
        );
      }

      if (prods.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-6 text-center text-slate-400 font-medium text-xs border border-slate-200">
            Nenhum insumo encontrado para este filtro.
          </div>
        `;
        return;
      }

      container.innerHTML = prods.map(p => {
        const qtd = state.quantidades.get(p.id) || 0;
        const temQtd = qtd > 0;
        return `
          <div class="bg-white rounded-2xl p-3.5 sm:p-4 border ${temQtd ? 'border-teal-500 ring-1 ring-teal-500/30 bg-teal-50/20' : 'border-slate-200/80'} shadow-2xs transition hover:shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex-1">
              <div class="flex items-center gap-1.5 mb-1">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-mono">
                  ${p.categoria || 'Geral'}
                </span>
                <span class="text-[10px] font-semibold text-slate-400">
                  Unid: <b class="text-slate-700">${p.unidade_medida || 'UN'}</b>
                </span>
              </div>
              <h3 class="text-xs sm:text-sm font-bold text-slate-900 leading-snug">${p.descricao}</h3>
            </div>

            <!-- Controles de Quantidade -->
            <div class="flex items-center justify-between sm:justify-end gap-2">
              <!-- Atalhos rápidos no mobile -->
              <div class="flex items-center gap-1 text-[10px]">
                <button type="button" onclick="alterarQtd(${p.id}, 5)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded-lg text-slate-700 font-bold transition">+5</button>
                <button type="button" onclick="alterarQtd(${p.id}, 10)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded-lg text-slate-700 font-bold transition">+10</button>
              </div>

              <!-- Stepper -->
              <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button type="button" onclick="alterarQtd(${p.id}, -1)" class="w-8 h-8 rounded-lg bg-white active:scale-90 shadow-2xs hover:bg-slate-50 flex items-center justify-center text-slate-700 font-black transition cursor-pointer">
                  <i class="fa-solid fa-minus text-xs"></i>
                </button>
                <input type="number" min="0" value="${qtd}" onchange="definirQtd(${p.id}, this.value)" class="w-12 text-center bg-transparent font-mono font-black text-sm text-slate-900 focus:outline-none">
                <button type="button" onclick="alterarQtd(${p.id}, 1)" class="w-8 h-8 rounded-lg bg-teal-600 active:scale-90 shadow-2xs hover:bg-teal-700 flex items-center justify-center text-white font-black transition cursor-pointer">
                  <i class="fa-solid fa-plus text-xs"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function alterarQtd(prodId, delta) {
      const atual = state.quantidades.get(prodId) || 0;
      const novaQtd = Math.max(0, atual + delta);
      if (novaQtd === 0) {
        state.quantidades.delete(prodId);
      } else {
        state.quantidades.set(prodId, novaQtd);
      }
      renderizarProdutos();
      atualizarTotais();
    }

    function definirQtd(prodId, valor) {
      const num = parseInt(valor, 10) || 0;
      if (num <= 0) {
        state.quantidades.delete(prodId);
      } else {
        state.quantidades.set(prodId, num);
      }
      renderizarProdutos();
      atualizarTotais();
    }

    function atualizarTotais() {
      let totalQtd = 0;
      state.quantidades.forEach(qtd => totalQtd += qtd);

      document.getElementById('totalItensQtd').textContent = totalQtd;
      const btn = document.getElementById('btnEnviarPedido');
      if (totalQtd === 0) {
        btn.classList.add('opacity-75');
      } else {
        btn.classList.remove('opacity-75');
      }
    }

    async function enviarPedido() {
      if (!state.unidadeId) {
        alert('Por favor, selecione o Prédio / Bloco correspondente no topo da página.');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const totalItens = Array.from(state.quantidades.values()).reduce((a, b) => a + b, 0);
      if (totalItens === 0) {
        if (!confirm('Você não informou quantidades para nenhum produto. Deseja enviar o pedido zerado para este prédio?')) {
          return;
        }
      }

      const respNome = document.getElementById('respNome').value.trim();
      const respTel = document.getElementById('respTel').value.trim();
      const obs = document.getElementById('pedidoObservacoes').value.trim();

      const itensPayload = [];
      state.quantidades.forEach((qtd, produtoId) => {
        if (qtd > 0) {
          itensPayload.push({ produto_id: produtoId, quantidade: qtd });
        }
      });

      const btn = document.getElementById('btnEnviarPedido');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Enviando Pedido...';

      try {
        const payload = {
          token: state.token,
          pedido_id: state.pedidoId,
          unidade_id: state.unidadeId,
          responsavel_nome: respNome,
          responsavel_telefone: respTel,
          observacoes: obs,
          itens: itensPayload
        };

        const res = await fetch('/api/publico/pedido-unidade', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();

        if (json.error) throw new Error(json.message || 'Erro ao enviar pedido.');

        state.ultimoEnvio = {
          unidade: state.unidades.find(u => u.id === state.unidadeId)?.nome_unidade || 'Prédio',
          responsavel: respNome || 'Responsável',
          telefone: respTel,
          totalItens: totalItens,
          dataEnvio: json.data_envio || new Date().toLocaleString('pt-BR'),
          itens: itensPayload.map(i => {
            const p = state.produtos.find(prod => prod.id === i.produto_id);
            return { descricao: p ? p.descricao : 'Item', quantidade: i.quantidade, unidade: p ? p.unidade_medida : 'UN' };
          })
        };

        exibirRecibo();

      } catch (err) {
        alert('Erro ao enviar pedido: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Confirmar Pedido do Prédio</span> <i class="fa-solid fa-paper-plane"></i>';
      }
    }

    function exibirRecibo() {
      document.getElementById('formContent').classList.add('hidden');
      document.getElementById('stickyBar').classList.add('hidden');

      const envio = state.ultimoEnvio;
      document.getElementById('reciboSubtitulo').textContent = `${envio.unidade} • ${formatarMesAno(state.anoMes)}`;

      let itensHtml = envio.itens.map(i => `
        <div class="flex justify-between py-1 border-b border-slate-200">
          <span class="truncate pr-2">${i.descricao}</span>
          <span class="font-bold flex-shrink-0">${i.quantidade} ${i.unidade}</span>
        </div>
      `).join('');

      if (envio.itens.length === 0) {
        itensHtml = '<div class="text-slate-400 py-1">Nenhum item solicitado (pedido zerado).</div>';
      }

      document.getElementById('reciboDetalhes').innerHTML = `
        <div class="pb-1 border-b border-slate-300 font-sans font-bold text-slate-800 flex justify-between">
          <span>Resumo do Pedido</span>
          <span class="text-emerald-700">${envio.totalItens} unidades no total</span>
        </div>
        <div class="max-h-60 overflow-y-auto pr-1 my-2">
          ${itensHtml}
        </div>
        <div class="pt-1 text-[11px] text-slate-500 font-sans space-y-0.5">
          <div><b>Responsável:</b> ${envio.responsavel} ${envio.telefone ? `(${envio.telefone})` : ''}</div>
          <div><b>Data de Envio:</b> ${envio.dataEnvio}</div>
        </div>
      `;

      document.getElementById('reciboSucesso').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function reabrirParaEdicao() {
      document.getElementById('reciboSucesso').classList.add('hidden');
      document.getElementById('formContent').classList.remove('hidden');
      document.getElementById('stickyBar').classList.remove('hidden');
    }

    function compartilharComprovanteWhatsApp() {
      const envio = state.ultimoEnvio;
      let texto = `*Comprovante de Pedido de Insumos - SISFAC 2.0*\n`;
      texto += `🏢 *Prédio:* ${envio.unidade}\n`;
      texto += `📅 *Competência:* ${formatarMesAno(state.anoMes)}\n`;
      texto += `👤 *Responsável:* ${envio.responsavel}\n`;
      texto += `📦 *Total de Itens:* ${envio.totalItens} unidades\n\n`;
      texto += `*Itens Solicitados:*\n`;
      envio.itens.forEach(i => {
        texto += `• ${i.quantidade} ${i.unidade} - ${i.descricao}\n`;
      });
      texto += `\n_Pedido registrado com sucesso no sistema em ${envio.dataEnvio}_.`;

      const urlWa = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
      window.open(urlWa, '_blank');
    }

    // Inicialização ao carregar
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
